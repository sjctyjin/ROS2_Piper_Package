# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm1_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    arm2_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    gripper_1_controller:
      type: position_controllers/GripperActionController


    gripper_2_controller:
      type: position_controllers/GripperActionController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm1_controller:
  ros__parameters:
    joints:
      - arm1_joint1
      - arm1_joint2
      - arm1_joint3
      - arm1_joint4
      - arm1_joint5
      - arm1_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
arm2_controller:
  ros__parameters:
    joints:
      - arm2_joint1
      - arm2_joint2
      - arm2_joint3
      - arm2_joint4
      - arm2_joint5
      - arm2_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
gripper_1_controller:
  ros__parameters:
    joint: arm1_joint7
gripper_2_controller:
  ros__parameters:
    joint: arm2_joint7